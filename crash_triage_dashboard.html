<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttercup Crash Triage Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        h1 {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            border-left: 4px solid #667eea;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        
        .stat-card h3 {
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        
        .stat-card .number {
            font-size: 2.5em;
            font-weight: 700;
            color: #667eea;
        }
        
        .cluster {
            background: #1e293b;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            border: 2px solid #334155;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        
        .cluster:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 8px 12px rgba(102, 126, 234, 0.2);
        }
        
        .cluster-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #334155;
        }
        
        .cluster-title {
            font-size: 1.3em;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .severity-badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .severity-high {
            background: #dc2626;
            color: white;
        }
        
        .severity-medium {
            background: #f59e0b;
            color: white;
        }
        
        .severity-low {
            background: #10b981;
            color: white;
        }
        
        .cluster-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .meta-item {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
        }
        
        .meta-label {
            font-size: 0.85em;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        
        .meta-value {
            font-weight: 600;
            color: #e2e8f0;
        }
        
        .dedup-token {
            font-family: 'Courier New', monospace;
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9em;
            color: #818cf8;
            word-break: break-all;
            margin-bottom: 15px;
        }
        
        .crash-count {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
        }
        
        .pov-list {
            margin-top: 20px;
        }
        
        .pov-item {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid #475569;
        }
        
        .pov-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .pov-id {
            font-family: 'Courier New', monospace;
            color: #818cf8;
            font-size: 0.9em;
        }
        
        .pov-task {
            color: #94a3b8;
            font-size: 0.9em;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        button:hover {
            background: #5568d3;
            transform: translateY(-1px);
        }
        
        .stack-trace {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            line-height: 1.6;
            overflow-x: auto;
            margin-top: 15px;
            display: none;
            border: 1px solid #334155;
        }
        
        .stack-trace.show {
            display: block;
        }
        
        .loading {
            text-align: center;
            padding: 60px;
            font-size: 1.2em;
            color: #94a3b8;
        }
        
        .error {
            background: #dc2626;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .no-crashes {
            text-align: center;
            padding: 60px;
            color: #94a3b8;
        }
        
        .no-crashes h2 {
            margin-bottom: 10px;
            color: #cbd5e1;
        }
        
        .refresh-btn {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 Buttercup Crash Triage Dashboard</h1>
            <p class="subtitle">Automated crash clustering and vulnerability analysis</p>
        </header>
        
        <div id="stats" class="stats"></div>
        <div id="clusters"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:1323';
        
        async function fetchCrashClusters() {
            try {
                const response = await fetch(`${API_BASE}/v1/dashboard/crash_clusters`);
                if (!response.ok) throw new Error('Failed to fetch clusters');
                return await response.json();
            } catch (error) {
                console.error('Error fetching crash clusters:', error);
                throw error;
            }
        }
        
        function getSeverity(crashCount) {
            if (crashCount >= 10) return { level: 'high', label: 'HIGH' };
            if (crashCount >= 5) return { level: 'medium', label: 'MEDIUM' };
            return { level: 'low', label: 'LOW' };
        }
        
        function formatDate(dateStr) {
            return new Date(dateStr).toLocaleString();
        }
        
        function toggleStackTrace(id) {
            const element = document.getElementById(`stack-${id}`);
            element.classList.toggle('show');
        }
        
        function renderStats(data) {
            const statsHtml = `
                <div class="stat-card">
                    <h3>Total Crashes</h3>
                    <div class="number">${data.total_crashes}</div>
                </div>
                <div class="stat-card">
                    <h3>Unique Bugs</h3>
                    <div class="number">${data.total_clusters}</div>
                </div>
                <div class="stat-card">
                    <h3>Unclustered</h3>
                    <div class="number">${data.unclustered.length}</div>
                </div>
                <div class="stat-card">
                    <h3>Avg Crashes/Bug</h3>
                    <div class="number">${data.total_clusters > 0 ? Math.round(data.total_crashes / data.total_clusters) : 0}</div>
                </div>
            `;
            document.getElementById('stats').innerHTML = statsHtml;
        }
        
        function renderClusters(data) {
            const container = document.getElementById('clusters');
            
            if (data.clusters.length === 0 && data.unclustered.length === 0) {
                container.innerHTML = `
                    <div class="no-crashes">
                        <h2>No crashes found yet</h2>
                        <p>Keep fuzzing to discover vulnerabilities</p>
                        <button class="refresh-btn" onclick="loadData()">Refresh</button>
                    </div>
                `;
                return;
            }
            
            let html = '';
            
            // Render clustered crashes
            data.clusters.forEach((cluster, idx) => {
                const severity = getSeverity(cluster.crash_count);
                const shortToken = cluster.dedup_token.split('--').slice(0, 3).join(' → ');
                
                html += `
                    <div class="cluster">
                        <div class="cluster-header">
                            <div class="cluster-title">
                                <span>Bug #${idx + 1}</span>
                                <span class="severity-badge severity-${severity.level}">${severity.label}</span>
                            </div>
                            <div class="crash-count">
                                ${cluster.crash_count} crash${cluster.crash_count > 1 ? 'es' : ''}
                            </div>
                        </div>
                        
                        <div class="dedup-token">
                            <strong>Dedup Token:</strong> ${shortToken}
                        </div>
                        
                        <div class="cluster-meta">
                            <div class="meta-item">
                                <div class="meta-label">First Seen</div>
                                <div class="meta-value">${formatDate(cluster.first_seen)}</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">Last Seen</div>
                                <div class="meta-value">${formatDate(cluster.last_seen)}</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">Fuzzers</div>
                                <div class="meta-value">${cluster.fuzzers.join(', ')}</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">Sanitizers</div>
                                <div class="meta-value">${cluster.sanitizers.join(', ')}</div>
                            </div>
                        </div>
                        
                        <div class="pov-list">
                            ${cluster.povs.slice(0, 3).map(pov => `
                                <div class="pov-item">
                                    <div class="pov-header">
                                        <span class="pov-id">POV: ${pov.pov.pov_id.substring(0, 8)}...</span>
                                        <span class="pov-task">Task: ${pov.task_name}</span>
                                    </div>
                                    ${pov.pov.stack_trace ? `
                                        <button onclick="toggleStackTrace('${pov.pov.pov_id}')">
                                            Toggle Stack Trace
                                        </button>
                                        <pre class="stack-trace" id="stack-${pov.pov.pov_id}">${pov.pov.stack_trace}</pre>
                                    ` : '<p style="color: #94a3b8;">No stack trace available</p>'}
                                </div>
                            `).join('')}
                            ${cluster.povs.length > 3 ? `<p style="color: #94a3b8; margin-top: 10px;">... and ${cluster.povs.length - 3} more</p>` : ''}
                        </div>
                    </div>
                `;
            });
            
            // Render unclustered crashes
            if (data.unclustered.length > 0) {
                html += `
                    <div class="cluster">
                        <div class="cluster-header">
                            <div class="cluster-title">
                                <span>Unclustered Crashes</span>
                                <span class="severity-badge severity-low">INFO</span>
                            </div>
                            <div class="crash-count">${data.unclustered.length}</div>
                        </div>
                        <p style="color: #94a3b8;">These crashes don't have dedup tokens yet</p>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }
        
        async function loadData() {
            try {
                document.getElementById('clusters').innerHTML = '<div class="loading">Loading crash data...</div>';
                const data = await fetchCrashClusters();
                renderStats(data);
                renderClusters(data);
            } catch (error) {
                document.getElementById('clusters').innerHTML = `
                    <div class="error">
                        <strong>Error loading crash data:</strong> ${error.message}
                        <br><br>
                        <button onclick="loadData()">Retry</button>
                    </div>
                `;
            }
        }
        
        // Load data on page load
        loadData();
        
        // Auto-refresh every 30 seconds
        setInterval(loadData, 30000);
    </script>
</body>
</html>
